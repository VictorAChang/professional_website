<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <title>Travels</title>
  </head>
  <body>
    <header>
      <div id="navbar-container">
        <!-- Navbar will be loaded here -->
      </div>
    </header>
    <section class="travel-hero">
      <div class="container">
        <i class="bi bi-globe"></i>
        <h1 class="display-4 fw-bold mb-3">Traveling Adventures</h1>
        <p class="lead fs-4 mb-4">Snapshots and stories from my journeys around the world</p>
      </div>
    </section>
    <div class="container py-5">
      <section class="gallery-section">
        <h2 class="h3 text-success mb-4 text-center">Photo Gallery</h2>
        <div class="gallery-grid">
          <!-- Example gallery items, replace src with your own images -->
          <div class="gallery-item">
            <img src="assets/traveling/casco.jpg" alt="Casco" class="gallery-img" />
            <div class="gallery-caption">Casco Viejo, Panama</div>
          </div>
          <div class="gallery-item">
            <img src="assets/traveling/taboga.jpg" alt="Taboga" class="gallery-img" />
            <div class="gallery-caption">Taboga Island, Panama</div>
          </div>
          <!-- Add more gallery items as needed -->
        </div>
      </section>
    </div>
    <style>
      .travel-hero {
        background: linear-gradient(120deg, #0dcaf0 0%, #198754 100%);
        color: #fff;
        padding: 5rem 0 3rem 0;
        text-align: center;
        position: relative;
      }
      .travel-hero .bi-globe {
        font-size: 3rem;
        color: #fff;
        margin-bottom: 1rem;
        filter: drop-shadow(0 2px 16px rgba(0,0,0,0.18));
      }
      .gallery-section {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 4px 24px rgba(33,135,84,0.08);
        margin-bottom: 2.5rem;
        padding: 2.5rem 2rem;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 2rem;
      }
      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        box-shadow: 0 2px 16px rgba(33,135,84,0.10);
        background: #f8f9fa;
        transition: transform 0.3s, box-shadow 0.3s;
      }
      .gallery-item:hover {
        transform: scale(1.04) rotate(-2deg);
        box-shadow: 0 8px 32px #0dcaf044;
      }
      .gallery-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 1rem;
        transition: opacity 0.3s;
      }
      .gallery-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(33,135,84,0.85);
        color: #fff;
        padding: 0.75rem 1rem;
        font-size: 1.1rem;
        opacity: 0;
        transition: opacity 0.3s;
        border-radius: 0 0 1rem 1rem;
      }
      .gallery-item:hover .gallery-caption {
        opacity: 1;
      }
      @media (max-width: 600px) {
        .gallery-img { height: 140px; }
      }
    </style>
    <style>
      html, body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
      }
      #footer-container {
        margin-top: auto;
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="scripts/loader.js"></script>
    <script src="scripts/toggle.js"></script>
    <div id="footer-container">
      <!-- Footer will be loaded here -->
    </div>
  </body>
</html>
